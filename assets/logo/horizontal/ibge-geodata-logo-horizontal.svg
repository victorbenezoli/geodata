    .green-dark { fill: #02582B; }
    .green-deep { fill: #027239; }
    .green-main { fill: #099841; }
    .green-light { fill: #1AA13D; }
    .yellow-accent { fill: #FDC408; }
    .wordmark { font-family: "Rubik Rounded", "Rubik", "Nunito Sans", "Arial Rounded MT Bold", system-ui, sans-serif; font-size: 124px; font-weight: 800; letter-spacing: -2.6px; }
    .wordmark-dark { fill: #02582B; }
    .wordmark-main { fill: #16A344; }
    .tagline { font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 38px; font-weight: 500; letter-spacing: 1.0px; fill: #129A42; }
  </style>

